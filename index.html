.wrap{max-width:560px;margin:0 auto;padding:10px}
h1{margin:4px 0 8px;text-align:center;font-size:1.5rem;background:var(--card);border:3px solid var(--brass);border-radius:16px;padding:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.tabs button{flex:1 1 30%;font-size:.95rem;font-weight:700;padding:9px 4px;border:3px solid var(--brass);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--brass);color:#fff}
.card{background:var(--card);border:3px solid var(--brass);border-radius:18px;padding:10px;margin-bottom:8px;text-align:center}
svg{width:100%;max-width:380px;touch-action:none;user-select:none;display:block;margin:0 auto}
#say{font-size:1.6rem;font-weight:800;min-height:1.6em;display:flex;align-items:center;justify-content:center}
.hint{font-size:.95rem;margin:4px 0}
#dig{display:inline-block;font-family:"Courier New",monospace;font-weight:800;font-size:1.8rem;letter-spacing:2px;background:#1d2b1a;color:#7dff8f;border-radius:10px;padding:2px 16px;margin:4px 0}#dig:empty{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
button.b{font-size:1.1rem;font-weight:700;padding:10px 14px;border-radius:14px;border:3px solid var(--brass);background:#fff;color:var(--ink);cursor:pointer}
button.b:hover{background:#ffe9b0}
button.big{background:var(--brass);color:#fff;font-size:1.25rem}
button.pa{background:var(--past);flex:1;color:#14411a}button.to{background:var(--to);flex:1;color:#5a2d00}
button.pa.gl{animation:gp 1s infinite alternate}button.to.gl{animation:gt 1s infinite alternate}
@keyframes gp{from{box-shadow:0 0 4px 1px #5ad66a}to{box-shadow:0 0 22px 9px #2bff5a}}
@keyframes gt{from{box-shadow:0 0 4px 1px #ffa94d}to{box-shadow:0 0 22px 9px #ff8a00}}
@keyframes gc{from{filter:drop-shadow(0 0 2px #2bff5a)}to{filter:drop-shadow(0 0 16px #00e640)}}
@keyframes go{from{filter:drop-shadow(0 0 2px #ffa94d)}to{filter:drop-shadow(0 0 16px #ff8a00)}}
svg.glow .hp{animation:gc 1s infinite alternate}svg.glow .ht{animation:go 1s infinite alternate}
.pre{font-size:.9rem;padding:8px 10px}
.msg{font-size:1.25rem;font-weight:800;min-height:1.8em}
.good{color:var(--ok)}.nope{color:var(--bad)}
.stars{font-size:1.1rem;font-weight:700}
.opt{width:100%;font-size:1.3rem}
.bar{display:inline-block;width:120px;height:10px;background:#eadbb0;border-radius:6px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
label{font-size:.95rem}
.cf{position:fixed;top:-40px;font-size:1.8rem;animation:fall 3s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
